<rect width="2200" height="1040" fill="#0D1117"/>
<text x="1100" y="78" text-anchor="middle" font-size="46" font-weight="700" fill="#E6EDF3">duck-droids: controller shortcuts</text>
<text x="1100" y="124" text-anchor="middle" font-size="27" fill="#9BA7B4">Hold a combo for 1 second. The same combo again ends a mode.</text>
