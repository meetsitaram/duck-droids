<text x="760" y="540" text-anchor="middle" font-size="20" fill="#9BA7B4">left stick</text>
<text x="1168" y="492" text-anchor="middle" font-size="20" fill="#9BA7B4">right stick</text>
<text x="1070" y="612" text-anchor="middle" font-size="20" fill="#9BA7B4">d-pad</text>
<rect x="40" y="190" width="560" height="240" rx="22" fill="#2A2110" stroke="#E3B341" stroke-width="4"/>
<text x="70" y="246" font-size="32" font-weight="700" fill="#E3B341">WALK  ·  RT + Y  (experimental)</text>
<text x="70" y="300" font-size="28" fill="#E6EDF3">left stick  =  walk</text>
<text x="70" y="342" font-size="28" fill="#E6EDF3">right stick  =  turn</text>
<text x="70" y="384" font-size="28" fill="#E6EDF3">d-pad  =  head</text>
<path d="M 600 374 L 1252 374 L 1312 391" fill="none" stroke="#E3B341" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#aE3B341)"/>
<rect x="40" y="470" width="560" height="200" rx="22" fill="#11231A" stroke="#3FB950" stroke-width="4"/>
<text x="70" y="526" font-size="32" font-weight="700" fill="#3FB950">STAND  ·  RT + A</text>
<text x="70" y="580" font-size="28" fill="#E6EDF3">right stick, d-pad  =  head</text>
<text x="70" y="622" font-size="28" fill="#E6EDF3">X = nod  ·  Y = "yes"  ·  B = "no"</text>
<path d="M 600 640 L 1340 640 L 1340 565" fill="none" stroke="#3FB950" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a3FB950)"/>
<rect x="1600" y="190" width="560" height="280" rx="22" fill="#2A1416" stroke="#F85149" stroke-width="4"/>
<text x="1630" y="246" font-size="32" font-weight="700" fill="#F85149">HEAD MODE  ·  RT + B  (sitting)</text>
<text x="1630" y="300" font-size="28" fill="#E6EDF3">RB / LB  =  next / previous emotion</text>
<text x="1630" y="342" font-size="28" fill="#E6EDF3">X  =  repeat</text>
<text x="1630" y="384" font-size="28" fill="#E6EDF3">right stick, d-pad  =  head</text>
<text x="1630" y="426" font-size="28" fill="#E6EDF3">Y = beak  ·  A = rest pose</text>
<path d="M 1600 330 L 1442 456" fill="none" stroke="#F85149" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#aF85149)"/>
<rect x="1600" y="510" width="560" height="200" rx="22" fill="#101E33" stroke="#58A6FF" stroke-width="4"/>
<text x="1630" y="566" font-size="32" font-weight="700" fill="#58A6FF">EMOTIONS  ·  RT + X  (standing)</text>
<text x="1630" y="620" font-size="28" fill="#E6EDF3">RB / LB  =  next / previous emotion</text>
<text x="1630" y="662" font-size="28" fill="#E6EDF3">X  =  repeat</text>
<path d="M 1600 560 L 1304 479" fill="none" stroke="#58A6FF" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#a58A6FF)"/>
<rect x="500" y="800" width="560" height="200" rx="22" fill="#1D1730" stroke="#BC8CFF" stroke-width="4"/>
<text x="530" y="856" font-size="32" font-weight="700" fill="#BC8CFF">WI-FI</text>
<text x="530" y="910" font-size="28" fill="#E6EDF3">LT + d-pad up  =  on</text>
<text x="530" y="952" font-size="28" fill="#E6EDF3">LT + d-pad down  =  off</text>
<path d="M 980 800 L 980 627" fill="none" stroke="#BC8CFF" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#aBC8CFF)"/>
<rect x="1140" y="800" width="560" height="200" rx="22" fill="#1A212B" stroke="#F0F6FC" stroke-width="4"/>
<text x="1170" y="856" font-size="32" font-weight="700" fill="#F0F6FC">STOP</text>
<text x="1170" y="910" font-size="28" fill="#E6EDF3">LB + RB  =  stop now</text>
<text x="1170" y="952" font-size="28" fill="#E6EDF3">RT + LT + RB + LB  =  shut down</text>
