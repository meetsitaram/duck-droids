# The Bluetooth speaker that bt_speaker.sh pairs, and connects at every boot, as the duck's audio output.
# Fill in ONE of the two (the MAC is surer; a name matches any device whose name contains it, case ignored).
# Don't know them? On the Pi, with the speaker in pairing mode: bash ~/duck/bt_speaker.sh scan
# Or set it on the Pi without editing this file (a later deploy.sh would overwrite this copy there):
#   bash ~/duck/bt_speaker.sh set "JBL Flip 5"        or        bash ~/duck/bt_speaker.sh set 11:22:33:AA:BB:CC
# That writes ~/.config/duck/bt_speaker.conf, which wins over this file; after the first pairing the speaker's MAC is saved there too.
SPEAKER_MAC=""
SPEAKER_NAME=""          # e.g. "INSMY-Clip-S" (the duck's, 2026-11-25); bash bt_speaker.sh set saves the choice on the Pi

SPEAKER_VOLUME="70%"        # set on the speaker's output once it connects
HELLO_SOUND=""              # a sound from pi/sounds/microduck/ played once connected, e.g. "yes" (off: it played at every boot, 2026-11-25)
SCAN_SECONDS=40             # how long one try scans for an unpaired speaker
